<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --chip-bg: rgba(0,0,0,0.65);
      --chip-fg: #fff;
      --btn-bg: rgba(0,0,0,0.75);
      --btn-fg: #fff;
      --btn-bg-hover: rgba(0,0,0,0.9);
      --shadow: 0 6px 24px rgba(0,0,0,0.15);
      --radius: 12px;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: #111;
      color: #eee;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }

    /* PDF area */
    #viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #1a1a1a;
    }

    /* Last updated chip */
    .chip {
      position: fixed;
      top: 14px;
      right: 14px;
      background: var(--chip-bg);
      color: var(--chip-fg);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      line-height: 1;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity .6s ease, transform .6s ease;
      pointer-events: auto;
      z-index: 5;
      white-space: nowrap;
    }
    .chip.show { opacity: 1; transform: translateY(0); }
    .chip.vanish { opacity: 0; transform: translateY(-6px); }

    /* Action buttons */
    .fab {
      position: fixed;
      right: 14px;
      bottom: 14px;
      display: flex;
      gap: 10px;
      z-index: 5;
    }
    .btn {
      appearance: none;
      border: none;
      border-radius: var(--radius);
      background: var(--btn-bg);
      color: var(--btn-fg);
      padding: 10px 14px;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: background .2s ease, transform .05s ease;
      text-decoration: none;
    }
    .btn:hover { background: var(--btn-bg-hover); }
    .btn:active { transform: translateY(1px); }
    .btn svg { width: 16px; height: 16px; }

    /* Fallback message */
    .fallback {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 32px;
    }
    .hidden { display: none !important; }

    @media print {
      .chip, .fab { display: none !important; }
      #viewer { inset: 0; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <iframe id="viewer" title="CV PDF"></iframe>

  <div id="chip" class="chip" aria-live="polite">Last updated: —</div>

  <div class="fab">
    <a id="downloadBtn" class="btn" download>
      <!-- download icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <path d="M7 10l5 5 5-5"/>
        <path d="M12 15V3"/>
      </svg>
      Download
    </a>
    <button id="printBtn" class="btn" type="button">
      <!-- printer icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 9V2h12v7"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"/>
        <path d="M6 14h12v8H6z"/>
      </svg>
      Print
    </button>
  </div>

  <div id="fallback" class="fallback hidden">
    <div>
      <p>Can’t display the PDF inline in this browser.</p>
      <p><a id="fallbackLink" href="#" class="btn">Open the CV</a></p>
    </div>
  </div>

  <script>
    (async function () {
      const viewer = document.getElementById('viewer');
      const chip = document.getElementById('chip');
      const downloadBtn = document.getElementById('downloadBtn');
      const printBtn = document.getElementById('printBtn');
      const fallback = document.getElementById('fallback');
      const fallbackLink = document.getElementById('fallbackLink');

      // Helpers
      const fmtDate = (iso) => {
        try {
          const d = new Date(iso);
          return d.toLocaleString(undefined, {
            year: 'numeric', month: 'short', day: '2-digit',
            hour: '2-digit', minute: '2-digit'
          });
        } catch { return iso; }
      };

      const showChip = (text) => {
        chip.textContent = text;
        chip.classList.add('show');
        // Vanish after 6s unless hovered
        let vanishTimer = setTimeout(() => chip.classList.add('vanish'), 6000);
        chip.addEventListener('mouseenter', () => {
          clearTimeout(vanishTimer);
          chip.classList.remove('vanish');
        });
        chip.addEventListener('mouseleave', () => {
          vanishTimer = setTimeout(() => chip.classList.add('vanish'), 2000);
        });
      };

      // Determine owner/repo from Pages URL, e.g. username.github.io/repo/
      const host = location.host;                  // "username.github.io"
      const owner = host.endsWith('.github.io') ? host.split('.github.io')[0] : host.split(':')[0];
      const pathParts = location.pathname.split('/').filter(Boolean);
      const repo = pathParts[0] || 'resume';

      // Try GitHub API to find the first .pdf in the repo root
      async function findPdfViaAPI() {
        const contentsURL = `https://api.github.com/repos/${owner}/${repo}/contents/`;
        const res = await fetch(contentsURL, { headers: { 'Accept': 'application/vnd.github+json' }});
        if (!res.ok) throw new Error('contents fetch failed');
        const items = await res.json();
        const pdf = items.find(i => i && i.name && i.name.toLowerCase().endsWith('.pdf'));
        if (!pdf) throw new Error('no pdf found');
        return pdf; // has .name, .download_url, .path
      }

      async function lastUpdatedForFile(path) {
        const commitsURL = `https://api.github.com/repos/${owner}/${repo}/commits?path=${encodeURIComponent(path)}&per_page=1`;
        const res = await fetch(commitsURL, { headers: { 'Accept': 'application/vnd.github+json' }});
        if (!res.ok) throw new Error('commits fetch failed');
        const data = await res.json();
        const c = Array.isArray(data) && data[0];
        return c ? (c.commit && c.commit.author && c.commit.author.date) : null;
      }

      function setViewer(src) {
        // Add small view hints to the PDF URL
        const hint = src.includes('#') ? '' : '#toolbar=0&navpanes=0&view=FitH';
        const url = src + hint;
        viewer.src = url;
        downloadBtn.href = src;
        fallbackLink.href = src;

        // Detect embed support: if it errors, show fallback (best-effort)
        let loaded = false;
        const timer = setTimeout(() => {
          if (!loaded) fallback.classList.remove('hidden');
        }, 3000);
        viewer.addEventListener('load', () => { loaded = true; clearTimeout(timer); }, { once: true });
      }

      printBtn.addEventListener('click', () => {
        // Many browsers print the embedded PDF directly
        window.print();
      });

      try {
        const pdfMeta = await findPdfViaAPI();
        setViewer(pdfMeta.download_url);

        try {
          const iso = await lastUpdatedForFile(pdfMeta.path);
          if (iso) showChip(`Last updated • ${fmtDate(iso)}`);
          else showChip('Last updated • unknown');
        } catch {
          showChip('Last updated • unavailable');
        }
      } catch {
        // Fallback if API is blocked or unavailable: assume cv.pdf next to this file
        const fallbackPdf = './cv.pdf';
        setViewer(fallbackPdf);
        showChip('Last updated • from file date');
        // Note: without the API, we can’t know commit time; using generic text.
      }
    })();
  </script>
</body>
</html>
